[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "AEGIS — Adaptive Encryption and Guarded Integrated Secret-Key System"
license = "MIT"
readme = "README.md"

[lib]
name = "aegis"
path = "src/lib.rs"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
# Authenticated Encryption (AEAD)
chacha20poly1305 = "0.10"

# Key Derivation & Hashing
hkdf = "0.12"
sha2 = "0.10"

# Cryptographically Secure Randomness
getrandom = "0.2"

# Memory Hygiene & Constant-Time Operations
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Error Handling, Serialization & CLI
thiserror = "2.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
# Property-based testing for Phase 9
proptest = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"